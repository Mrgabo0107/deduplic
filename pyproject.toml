[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deduplic"
version = "0.1.0"
description = "Python library and CLI for deduplicating records in JSON files."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Gabriel David Moreno Reyes" }
]
#IN CASE OF PUBLICATION
# classifiers = [
#     "Programming Language :: Python :: 3",
#     "Operating System :: OS Independent",
# ]
dependencies = [
    "streamlit>=1.30.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]

[project.scripts]
deduplic = "deduplic.cli:main"
deduplic-gui = "deduplic.gui:launch_gui"

[tool.setuptools.packages.find]
where = ["src"]
